name: Deploy to Railway (full app)

# ينشر التطبيق كاملاً (الواجهة + الباكند + Celery worker) على Railway عبر `railway up`،
# باستخدام deploy/railway/Dockerfile. الدليل: docs/DEPLOY_RAILWAY_AR.md
#
# Railway لا يلتقط تلقائياً Dockerfile داخل مجلد فرعي، لذلك يجب أن يحتوي المستودع/الخدمة على:
#   RAILWAY_DOCKERFILE_PATH=/deploy/railway/Dockerfile
#
# إن كنت تفضّل «GitHub Auto-Deploy» المدمج في Railway، أوقف هذا الـ workflow
# (Actions → Deploy to Railway → Disable workflow) حتى لا يتكرر النشر مرتين لكل push.
#
# الإعداد المطلوب:
#   Secret   RAILWAY_TOKEN        : Project Token من Railway → Project Settings → Tokens
#   Variable RAILWAY_SERVICE      : اسم الخدمة أو معرّفها
#   Variable RAILWAY_ENVIRONMENT  : production (افتراضي)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/railway/**"
      - "src-tauri/tauri.conf.json"
      - "requirements.txt"
      - "init_database.py"
      - ".github/workflows/deploy-railway.yml"

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    name: railway up
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required configuration
        env:
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::缺少仓库 secret RAILWAY_TOKEN（Railway project token）"
            exit 1
          fi
          if [ -z "${SERVICE}" ]; then
            echo "::error::缺少仓库变量 RAILWAY_SERVICE（Railway 服务名或 ID）"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        env:
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
          ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: railway up --ci --service="$SERVICE" --environment="$ENVIRONMENT"

      - name: Smoke test
        if: success()
        env:
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
          ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          DOMAIN="$(railway domain --service="$SERVICE" --environment="$ENVIRONMENT" 2>/dev/null | tail -1)"
          case "$DOMAIN" in
            http*) ;;
            *) DOMAIN="https://$DOMAIN" ;;
          esac
          echo "Health check: $DOMAIN/api/v1/health/"
          for attempt in $(seq 1 20); do
            if curl -fsS "$DOMAIN/api/v1/health/"; then
              echo "✅ الباكند يستجيب"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::لم يستجب /api/v1/health/ خلال 200 ثانية؛ راجع Deploy Logs في Railway"
          exit 1
